name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || format('{0}/homebrew-tap', github.repository_owner) }}
  TAP_FORMULA_PATH: ${{ vars.HOMEBREW_TAP_FORMULA_PATH || 'Formula/pty-mcp.rb' }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compute release version
        id: version
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          version="${ref_name#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package release archive
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}" "${{ matrix.target }}" dist

      - name: Upload packaged archive
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs:
      - build
      - github-release
    env:
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Compute release version
        id: version
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          version="${ref_name#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Skip when tap token is unavailable
        if: env.HOMEBREW_TAP_GITHUB_TOKEN == ''
        run: echo "HOMEBREW_TAP_GITHUB_TOKEN is not set; skipping Homebrew tap update."

      - name: Render formula
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        run: |
          mkdir -p generated
          ./scripts/render-homebrew-formula.sh "${{ steps.version.outputs.version }}" "${{ github.repository }}" dist \
            > generated/pty-mcp.rb

      - name: Commit formula update to tap repository
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap
          mkdir -p "tap/$(dirname "${TAP_FORMULA_PATH}")"
          cp generated/pty-mcp.rb "tap/${TAP_FORMULA_PATH}"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "${TAP_FORMULA_PATH}"; then
            echo "Formula already up to date."
            exit 0
          fi

          git add "${TAP_FORMULA_PATH}"
          git commit -m "Update pty-mcp to v${VERSION}"
          git push
